# OpenBPM (処理ロジック) CI — CPU 版ソルバーのビルド + サンプルのスモーク実行。
# CUDA/MPI はランナーに無いため WITH_CUDA=OFF / WITH_MPI=OFF でビルドする。
name: CI

on:
  push:
    branches: [ main, "claude/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # タグ push 時の Release 添付に使用
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ libhdf5-dev libeigen3-dev

      - name: Configure (CPU only)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=OFF -DWITH_MPI=OFF -DWITH_TESTS=ON

      - name: Build obpm / obpm_post
        run: cmake --build build -j"$(nproc)"

      # ctest の一部 (mode_beat / wlsweep) は HDF5 を読むため h5py/numpy を使う
      - name: Install test dependencies
        run: python3 -m pip install --upgrade h5py numpy

      - name: Unit tests (解析解との比較検証)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test — solver (fiber sample)
        run: |
          mkdir -p /tmp/smoke && cp data/sample/fiber.ofd /tmp/smoke/
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 fiber.ofd
          grep -q "normal end" obpm.log
          test -s obpm.out

      - name: Smoke test — post processor
        run: |
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/obpm_post" -n 2 fiber.ofd

      # data/ 直下の全サンプルを実行し HDF5 出力と正常終了を確認する
      # (obpm.out は不要なので -no-fdtd-out でスキップ)
      - name: Smoke test — all samples
        run: |
          mkdir -p /tmp/smoke-all && cd /tmp/smoke-all
          for f in "$GITHUB_WORKSPACE"/data/*.ofd; do
            echo "== $(basename "$f") =="
            "$GITHUB_WORKSPACE/bin/obpm" -n 2 -no-fdtd-out "$f" > run.log 2>&1 || { tail -20 run.log; exit 1; }
            grep -q "normal end" obpm.log
            test -s time_series_data.h5
            rm -f obpm.log time_series_data.h5 run.log
          done

      # ONN 光活性化関数 (tpa + powersweep) : activation_curve.csv を生成し、
      # 平面波近似の解析解との一致 (相対 7% 以内) ・単調非増加・飽和を検証する
      - name: Smoke test — ONN activation curve (TPA + powersweep)
        run: |
          mkdir -p /tmp/smoke-onn && cp data/sample/onn_activation.ofd /tmp/smoke-onn/
          cd /tmp/smoke-onn
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 onn_activation.ofd
          grep -q "normal end" obpm.log
          test -s activation_curve.csv
          # 定量検証: 平面波近似の解析解 T = 1/(1 + beta*(P_in/A_eff)*L) と比較
          # (単調性・飽和・P_out<=P_in も併せて検査。Python 標準ライブラリのみ)
          python3 "$GITHUB_WORKSPACE/tests/check_activation.py" --dir .

      - name: Upload binaries (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: obpm-linux-x64
          path: |
            bin/obpm
            bin/obpm_post

      # タグ (v*) push 時は Release にバイナリを添付する。
      # OpenFDTD-X (GUI) や統合テストはここから取得できる (公開リポジトリ)。
      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar czf obpm-linux-x64.tar.gz -C bin obpm obpm_post

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: obpm-linux-x64.tar.gz

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            /tmp/smoke/*.log
            /tmp/smoke-onn/*.log
          if-no-files-found: ignore

  # macOS (Apple Silicon)。AppleClang は OpenMP を同梱しないため、
  # Homebrew の libomp を明示指定して find_package(OpenMP) を通す。
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write   # タグ push 時の Release 添付に使用
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install libomp hdf5 eigen

      - name: Configure (CPU only)
        run: |
          OMP="$(brew --prefix libomp)"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=OFF -DWITH_MPI=OFF -DWITH_TESTS=ON \
            -DOpenMP_C_FLAGS="-Xclang -fopenmp -I${OMP}/include" \
            -DOpenMP_C_LIB_NAMES=omp \
            -DOpenMP_CXX_FLAGS="-Xclang -fopenmp -I${OMP}/include" \
            -DOpenMP_CXX_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="${OMP}/lib/libomp.dylib"

      - name: Build obpm / obpm_post
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      # ctest の一部 (mode_beat / wlsweep) は HDF5 を読むため h5py/numpy を使う
      - name: Install test dependencies
        run: python3 -m pip install --upgrade h5py numpy

      - name: Unit tests (解析解との比較検証)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test — solver (fiber sample)
        run: |
          mkdir -p /tmp/smoke && cp data/sample/fiber.ofd /tmp/smoke/
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 fiber.ofd
          grep -q "normal end" obpm.log
          test -s obpm.out

      - name: Smoke test — post processor
        run: |
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/obpm_post" -n 2 fiber.ofd

      # ONN 光活性化関数 (tpa + powersweep) : activation_curve.csv を生成し、
      # 平面波近似の解析解との一致 (相対 7% 以内) ・単調非増加・飽和を検証する
      - name: Smoke test — ONN activation curve (TPA + powersweep)
        run: |
          mkdir -p /tmp/smoke-onn && cp data/sample/onn_activation.ofd /tmp/smoke-onn/
          cd /tmp/smoke-onn
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 onn_activation.ofd
          grep -q "normal end" obpm.log
          test -s activation_curve.csv
          # 定量検証: 平面波近似の解析解 T = 1/(1 + beta*(P_in/A_eff)*L) と比較
          # (単調性・飽和・P_out<=P_in も併せて検査。Python 標準ライブラリのみ)
          python3 "$GITHUB_WORKSPACE/tests/check_activation.py" --dir .

      - name: Upload binaries (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: obpm-macos-arm64
          path: |
            bin/obpm
            bin/obpm_post

      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar czf obpm-macos-arm64.tar.gz -C bin obpm obpm_post

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: obpm-macos-arm64.tar.gz

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-macos
          path: |
            /tmp/smoke/*.log
            /tmp/smoke-onn/*.log
          if-no-files-found: ignore

  # Windows (MSVC)。依存は vcpkg (x64-windows-static-md 静的リンク) で導入し、
  # DLL 同梱不要の自己完結 exe を生成する。ビルドは MSVC 環境 + Ninja。
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write   # タグ push 時の Release 添付に使用
    steps:
      - uses: actions/checkout@v4

      # hdf5 の既定機能 szip は libaec を gitlab.dkrz.de から取得するが
      # 429 で落ちることがあるため、必要な core+zlib のみに絞る
      - name: Install dependencies (vcpkg)
        run: vcpkg install "hdf5[core,zlib]:x64-windows-static-md" eigen3:x64-windows-static-md --recurse

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (CPU only)
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DWITH_CUDA=OFF -DWITH_MPI=OFF -DWITH_TESTS=ON
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build obpm / obpm_post
        run: cmake --build build

      # ctest の一部 (mode_beat / wlsweep) は HDF5 を読むため h5py/numpy を使う
      - name: Install test dependencies
        run: python -m pip install --upgrade h5py numpy

      - name: Unit tests (解析解との比較検証)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test — solver (fiber sample)
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          Copy-Item data/sample/fiber.ofd smoke/
          Set-Location smoke
          & "$env:GITHUB_WORKSPACE\bin\obpm.exe" -n 2 fiber.ofd
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Path obpm.log -Pattern "normal end" -Quiet)) { Write-Error "no normal end"; exit 1 }
          if ((Get-Item obpm.out).Length -eq 0) { Write-Error "empty obpm.out"; exit 1 }
          & "$env:GITHUB_WORKSPACE\bin\obpm_post.exe" -n 2 fiber.ofd
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke test — BPM propagation map (post output)
        run: |
          Set-Location smoke
          if (-not (Test-Path bpm_ixz.csv)) { Write-Error "bpm_ixz.csv missing"; exit 1 }

      # ONN 光活性化関数 (tpa + powersweep) : activation_curve.csv を生成し、
      # 平面波近似の解析解との一致 (相対 7% 以内) ・単調非増加・飽和を検証する
      - name: Smoke test — ONN activation curve (TPA + powersweep)
        run: |
          New-Item -ItemType Directory -Force smoke-onn | Out-Null
          Copy-Item data/sample/onn_activation.ofd smoke-onn/
          Set-Location smoke-onn
          & "$env:GITHUB_WORKSPACE\bin\obpm.exe" -n 2 onn_activation.ofd
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Path obpm.log -Pattern "normal end" -Quiet)) { Write-Error "no normal end"; exit 1 }
          if (-not (Test-Path activation_curve.csv)) { Write-Error "activation_curve.csv missing"; exit 1 }
          # 定量検証: 平面波近似の解析解 T = 1/(1 + beta*(P_in/A_eff)*L) と比較
          # (3 OS で同一の検証スクリプトを使う。Python 標準ライブラリのみ)
          python "$env:GITHUB_WORKSPACE\tests\check_activation.py" --dir .
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload binaries (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: obpm-windows-x64
          path: |
            bin/obpm.exe
            bin/obpm_post.exe

      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path bin/obpm.exe, bin/obpm_post.exe -DestinationPath obpm-windows-x64.zip

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: obpm-windows-x64.zip

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-windows
          path: |
            smoke/*.log
            smoke-onn/*.log
            smoke-rcwa/*.log
          if-no-files-found: ignore

  # CUDA 版のコンパイル・リンク検証 (ランナーに GPU は無いため実行はしない)
  build-cuda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (incl. CUDA toolkit)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ libhdf5-dev libeigen3-dev nvidia-cuda-toolkit

      - name: Configure (CUDA)
        run: cmake -B build_cuda -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=ON -DWITH_MPI=OFF

      - name: Build obpm_cuda (compile/link only)
        run: cmake --build build_cuda --target obpm_cuda -j"$(nproc)"

  # MPI 版 (obpm_mpi = OpenFDTD 由来の FDTD ソルバー) のビルド検証。
  # mpi/solve.c は並列 HDF5 (H5Pset_fapl_mpio 等) を使うため libhdf5-openmpi-dev が必要。
  build-mpi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (MPI + parallel HDF5)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ libeigen3-dev \
            libopenmpi-dev openmpi-bin libhdf5-openmpi-dev

      - name: Configure (MPI)
        run: cmake -B build_mpi -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=OFF -DWITH_MPI=ON

      # obpm_mpi だけでなく全ターゲットをビルドする。並列 HDF5 のヘッダは
      # mpi.h を include するため、MPI を使わない obpm / obpm_post 側が
      # 壊れていても --target obpm_mpi では検知できない (実際に起きた)。
      - name: Build all targets (obpm / obpm_post / obpm_mpi)
        run: cmake --build build_mpi -j"$(nproc)"
