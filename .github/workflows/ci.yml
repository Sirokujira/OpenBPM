# OpenBPM (処理ロジック) CI — CPU 版ソルバーのビルド + サンプルのスモーク実行。
# CUDA/MPI はランナーに無いため WITH_CUDA=OFF / WITH_MPI=OFF でビルドする。
name: CI

# 課金対策 (private リポジトリは Actions 無料枠 2,000 分/月):
# - 以前は push (claude/**) と pull_request の両方が発火し、PR を持つブランチでは
#   同一コミットで全ジョブが 2 回走っていた → push は main とタグのみに限定。
#   作業ブランチは PR イベント側でカバーする (PR の無いブランチは workflow_dispatch で
#   手動実行できる)。
# - concurrency で同一 ref の旧 run をキャンセルし、連続 push の重複消費を防ぐ。
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # タグ push 時の Release 添付に使用
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ libhdf5-dev libeigen3-dev

      - name: Configure (CPU only)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=OFF -DWITH_MPI=OFF -DWITH_TESTS=ON

      - name: Build obpm / obpm_post
        run: cmake --build build -j"$(nproc)"

      # ctest の一部 (mode_beat / wlsweep) は HDF5 を読むため h5py/numpy を使う
      - name: Install test dependencies
        run: python3 -m pip install --upgrade h5py numpy

      - name: Unit tests (解析解との比較検証)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test — solver (fiber sample)
        run: |
          mkdir -p /tmp/smoke && cp data/sample/fiber.ofd /tmp/smoke/
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 fiber.ofd
          grep -q "normal end" obpm.log
          test -s obpm.out

      - name: Smoke test — post processor
        run: |
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/obpm_post" -n 2 fiber.ofd

      # 1 行目のプログラム名の受理範囲 (GUI 連携の回帰防止)
      # OpenFDTD-X が書き出す .ofd は "OpenFDTD" ヘッダなので受け付ける必要がある。
      # 未知の名前は実際に読んだ名前を添えて弾くこと。
      - name: Smoke test — .ofd header (OpenBPM / OpenFDTD / unknown)
        run: |
          mkdir -p /tmp/smoke-hdr && cd /tmp/smoke-hdr
          sed 's/^OpenBPM 2 2/OpenFDTD 2 2/' "$GITHUB_WORKSPACE/data/sample/fiber.ofd" > hdr_fdtd.ofd
          sed 's/^OpenBPM 2 2/OpenMOM 2 2/'  "$GITHUB_WORKSPACE/data/sample/fiber.ofd" > hdr_bad.ofd
          # OpenFDTD ヘッダ : 受理され OpenBPM ヘッダと同一の結果になること
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 -no-fdtd-out hdr_fdtd.ofd
          grep -q "normal end" obpm.log
          grep -q "output power = 3.122518e+02" obpm.log
          # 未知のヘッダ : 非ゼロ終了し、読んだ名前がメッセージに出ること
          if "$GITHUB_WORKSPACE/bin/obpm" -n 2 -no-fdtd-out hdr_bad.ofd > bad.log 2>&1; then
            echo "FAIL: unknown header was accepted"; cat bad.log; exit 1
          fi
          grep -q 'not OpenBPM data : 1st line = "OpenMOM"' bad.log
          echo "header check OK"

      # data/ 直下の全サンプルを実行し HDF5 出力と正常終了を確認する
      # (obpm.out は不要なので -no-fdtd-out でスキップ)
      - name: Smoke test — all samples
        run: |
          mkdir -p /tmp/smoke-all && cd /tmp/smoke-all
          for f in "$GITHUB_WORKSPACE"/data/*.ofd; do
            echo "== $(basename "$f") =="
            "$GITHUB_WORKSPACE/bin/obpm" -n 2 -no-fdtd-out "$f" > run.log 2>&1 || { tail -20 run.log; exit 1; }
            grep -q "normal end" obpm.log
            test -s time_series_data.h5
            rm -f obpm.log time_series_data.h5 run.log
          done

      # ONN 光活性化関数 (tpa + powersweep) : activation_curve.csv を生成し、
      # 平面波近似の解析解との一致 (相対 7% 以内) ・単調非増加・飽和を検証する
      - name: Smoke test — ONN activation curve (TPA + powersweep)
        run: |
          mkdir -p /tmp/smoke-onn && cp data/sample/onn_activation.ofd /tmp/smoke-onn/
          cd /tmp/smoke-onn
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 onn_activation.ofd
          grep -q "normal end" obpm.log
          test -s activation_curve.csv
          # 定量検証: 平面波近似の解析解 T = 1/(1 + beta*(P_in/A_eff)*L) と比較
          # (単調性・飽和・P_out<=P_in も併せて検査。Python 標準ライブラリのみ)
          python3 "$GITHUB_WORKSPACE/tests/check_activation.py" --dir .

      # モード解析 (modes = <n> excite) : シングルモードで LP01 のみ導波と判定され、
      # neff が分散方程式の厳密解 1.447167 と一致すること (±5e-4)
      - name: Smoke test — mode analysis (modes keyword)
        run: |
          mkdir -p /tmp/smoke-modes && cp data/sample/fiber_modes.ofd /tmp/smoke-modes/
          cd /tmp/smoke-modes
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 fiber_modes.ofd
          grep -q "normal end" obpm.log
          grep -q "modes : 1 / 3 converged" obpm.log
          awk '/mode 1 : neff/ { err = $NF - 1.447167; if (err < 0) err = -err
               if (err > 5e-4) { print "FAIL: neff " $NF " != 1.447167 (err " err ")"; exit 1 }
               print "mode analysis OK: neff = " $NF; ok = 1 }
               END { if (!ok) { print "FAIL: neff line not found"; exit 1 } }' obpm.log
          # モード結合率 (/trace/overlap) : モード整合励振なので出口でも eta_1 > 0.99
          awk '/overlap eta_1/ { e = $(NF-3) + 0
               if (e < 0.99) { print "FAIL: eta_1 " e " < 0.99 (mode-matched excitation)"; exit 1 }
               print "mode overlap OK: eta_1 = " e; ok = 1 }
               END { if (!ok) { print "FAIL: overlap line not found"; exit 1 } }' obpm.log

      # テーパ/ツイスト (座標変換) : 合計回転角のログと断熱的な電力保存を判定する
      # (入射ガウシアン w0=4um の生パワー 226.2 に対し P/P0 = 0.9985)
      - name: Smoke test — taper / twist (coordinate transform)
        run: |
          mkdir -p /tmp/smoke-tt && cp data/sample/taper_twist.ofd /tmp/smoke-tt/
          cd /tmp/smoke-tt
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 taper_twist.ofd
          grep -q "normal end" obpm.log
          grep -q "total 90.00 \[deg\]" obpm.log
          awk '/output power/ { p = $(NF-1) + 0
               if (p < 220 || p > 230) { print "FAIL: output power " p " out of [220,230]"; exit 1 }
               print "taper/twist OK: output power = " p; ok = 1 }
               END { if (!ok) { print "FAIL: output power line not found"; exit 1 } }' obpm.log

      # 対称境界 : 半領域計算で出力パワーが全領域の 1/2 になることを判定する
      - name: Smoke test — symmetry boundary
        run: |
          mkdir -p /tmp/smoke-sym && cp data/sample/fiber_symmetry.ofd /tmp/smoke-sym/
          cd /tmp/smoke-sym
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 fiber_symmetry.ofd
          grep -q "normal end" obpm.log
          awk '/output power/ { p = $(NF-1) + 0
               if (p < 155.0 || p > 157.5) { print "FAIL: output power " p " out of [155.0,157.5]"; exit 1 }
               print "symmetry OK: output power = " p; ok = 1 }
               END { if (!ok) { print "FAIL: output power line not found"; exit 1 } }' obpm.log

      - name: Upload binaries (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: obpm-linux-x64
          path: |
            bin/obpm
            bin/obpm_post

      # タグ (v*) push 時は Release にバイナリを添付する。
      # OpenFDTD-X (GUI) や統合テストはここから取得できる (公開リポジトリ)。
      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar czf obpm-linux-x64.tar.gz -C bin obpm obpm_post

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: obpm-linux-x64.tar.gz

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            /tmp/smoke/*.log
            /tmp/smoke-onn/*.log
          if-no-files-found: ignore

  # macOS (Apple Silicon)。AppleClang は OpenMP を同梱しないため、
  # CMakeLists が Homebrew の libomp を自動検出して find_package(OpenMP) を通す。
  # このジョブはその自動検出の検証も兼ねる (-DOpenMP_* を渡さずに configure する)。
  build-macos:
    # macOS ランナーは課金レート x10 (private リポジトリ) で最も高価なため、
    # main への push・タグ・手動実行のみに限定する (PR では実行しない)。
    # PR 段階の移植性は build-windows (MSVC, x2) が主に担保している。
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write   # タグ push 時の Release 添付に使用
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install libomp hdf5 eigen

      # Python3_EXECUTABLE は pip install と同じ PATH の python3 に固定する
      # (FindPython3 が別のインタプリタを拾うと ctest で h5py が import 不能になる。
      #  Windows で実際に発生したのと同じ問題の予防)
      # OpenMP のフラグは CMakeLists が Homebrew の libomp を自動検出して設定する
      # (ReadMe が案内する素の `cmake -S . -B build` が macOS で通ることの検証を
      #  兼ねるため、ここで -DOpenMP_* を明示指定しない)
      - name: Configure (CPU only)
        run: |
          # 既定シェルは bash -e (pipefail なし) のため、tee へのパイプで
          # cmake の失敗が握り潰されないよう明示的に有効化する
          set -o pipefail
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=OFF -DWITH_MPI=OFF -DWITH_TESTS=ON \
            -DPython3_EXECUTABLE="$(command -v python3)" 2>&1 | tee configure.log
          grep -q "Homebrew の libomp を使用します" configure.log

      - name: Build obpm / obpm_post
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      # ctest の一部 (mode_beat / wlsweep) は HDF5 を読むため h5py/numpy を使う。
      # macOS ランナーの python3 は PEP 668 (externally-managed) で pip install を
      # 拒否するため --break-system-packages を付ける (使い捨ての CI 環境なので可)
      - name: Install test dependencies
        run: python3 -m pip install --break-system-packages --upgrade h5py numpy

      - name: Unit tests (解析解との比較検証)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test — solver (fiber sample)
        run: |
          mkdir -p /tmp/smoke && cp data/sample/fiber.ofd /tmp/smoke/
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 fiber.ofd
          grep -q "normal end" obpm.log
          test -s obpm.out

      - name: Smoke test — post processor
        run: |
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/obpm_post" -n 2 fiber.ofd

      # ONN 光活性化関数 (tpa + powersweep) : activation_curve.csv を生成し、
      # 平面波近似の解析解との一致 (相対 7% 以内) ・単調非増加・飽和を検証する
      - name: Smoke test — ONN activation curve (TPA + powersweep)
        run: |
          mkdir -p /tmp/smoke-onn && cp data/sample/onn_activation.ofd /tmp/smoke-onn/
          cd /tmp/smoke-onn
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 onn_activation.ofd
          grep -q "normal end" obpm.log
          test -s activation_curve.csv
          # 定量検証: 平面波近似の解析解 T = 1/(1 + beta*(P_in/A_eff)*L) と比較
          # (単調性・飽和・P_out<=P_in も併せて検査。Python 標準ライブラリのみ)
          python3 "$GITHUB_WORKSPACE/tests/check_activation.py" --dir .

      # モード解析 (modes = <n> excite) : シングルモードで LP01 のみ導波と判定され、
      # neff が分散方程式の厳密解 1.447167 と一致すること (±5e-4)
      - name: Smoke test — mode analysis (modes keyword)
        run: |
          mkdir -p /tmp/smoke-modes && cp data/sample/fiber_modes.ofd /tmp/smoke-modes/
          cd /tmp/smoke-modes
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 fiber_modes.ofd
          grep -q "normal end" obpm.log
          grep -q "modes : 1 / 3 converged" obpm.log
          awk '/mode 1 : neff/ { err = $NF - 1.447167; if (err < 0) err = -err
               if (err > 5e-4) { print "FAIL: neff " $NF " != 1.447167 (err " err ")"; exit 1 }
               print "mode analysis OK: neff = " $NF; ok = 1 }
               END { if (!ok) { print "FAIL: neff line not found"; exit 1 } }' obpm.log
          # モード結合率 (/trace/overlap) : モード整合励振なので出口でも eta_1 > 0.99
          awk '/overlap eta_1/ { e = $(NF-3) + 0
               if (e < 0.99) { print "FAIL: eta_1 " e " < 0.99 (mode-matched excitation)"; exit 1 }
               print "mode overlap OK: eta_1 = " e; ok = 1 }
               END { if (!ok) { print "FAIL: overlap line not found"; exit 1 } }' obpm.log

      # テーパ/ツイスト (座標変換) : 合計回転角のログと断熱的な電力保存を判定する
      # (入射ガウシアン w0=4um の生パワー 226.2 に対し P/P0 = 0.9985)
      - name: Smoke test — taper / twist (coordinate transform)
        run: |
          mkdir -p /tmp/smoke-tt && cp data/sample/taper_twist.ofd /tmp/smoke-tt/
          cd /tmp/smoke-tt
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 taper_twist.ofd
          grep -q "normal end" obpm.log
          grep -q "total 90.00 \[deg\]" obpm.log
          awk '/output power/ { p = $(NF-1) + 0
               if (p < 220 || p > 230) { print "FAIL: output power " p " out of [220,230]"; exit 1 }
               print "taper/twist OK: output power = " p; ok = 1 }
               END { if (!ok) { print "FAIL: output power line not found"; exit 1 } }' obpm.log

      # 対称境界 : 半領域計算で出力パワーが全領域の 1/2 になることを判定する
      - name: Smoke test — symmetry boundary
        run: |
          mkdir -p /tmp/smoke-sym && cp data/sample/fiber_symmetry.ofd /tmp/smoke-sym/
          cd /tmp/smoke-sym
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 fiber_symmetry.ofd
          grep -q "normal end" obpm.log
          awk '/output power/ { p = $(NF-1) + 0
               if (p < 155.0 || p > 157.5) { print "FAIL: output power " p " out of [155.0,157.5]"; exit 1 }
               print "symmetry OK: output power = " p; ok = 1 }
               END { if (!ok) { print "FAIL: output power line not found"; exit 1 } }' obpm.log

      - name: Upload binaries (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: obpm-macos-arm64
          path: |
            bin/obpm
            bin/obpm_post

      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar czf obpm-macos-arm64.tar.gz -C bin obpm obpm_post

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: obpm-macos-arm64.tar.gz

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-macos
          path: |
            /tmp/smoke/*.log
            /tmp/smoke-onn/*.log
          if-no-files-found: ignore

  # Windows (MSVC)。依存は vcpkg (x64-windows-static-md 静的リンク) で導入し、
  # DLL 同梱不要の自己完結 exe を生成する。ビルドは MSVC 環境 + Ninja。
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write   # タグ push 時の Release 添付に使用
    steps:
      - uses: actions/checkout@v4

      # hdf5 の既定機能 szip は libaec を gitlab.dkrz.de から取得するが
      # 429 で落ちることがあるため、必要な core+zlib のみに絞る
      - name: Install dependencies (vcpkg)
        run: vcpkg install "hdf5[core,zlib]:x64-windows-static-md" eigen3:x64-windows-static-md --recurse

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      # Python3_EXECUTABLE を PATH の python に固定する。CMake の FindPython3 は
      # hostedtoolcache 内の最新版 (pip install した python と別物) を拾うことが
      # あり、ctest の h5py/numpy を使うテストが import エラーになる (実際に発生)
      - name: Configure (CPU only)
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DWITH_CUDA=OFF -DWITH_MPI=OFF -DWITH_TESTS=ON
          "-DPython3_EXECUTABLE=$((Get-Command python).Source)"
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build obpm / obpm_post
        run: cmake --build build

      # ctest の一部 (mode_beat / wlsweep) は HDF5 を読むため h5py/numpy を使う
      - name: Install test dependencies
        run: python -m pip install --upgrade h5py numpy

      - name: Unit tests (解析解との比較検証)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test — solver (fiber sample)
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          Copy-Item data/sample/fiber.ofd smoke/
          Set-Location smoke
          & "$env:GITHUB_WORKSPACE\bin\obpm.exe" -n 2 fiber.ofd
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Path obpm.log -Pattern "normal end" -Quiet)) { Write-Error "no normal end"; exit 1 }
          if ((Get-Item obpm.out).Length -eq 0) { Write-Error "empty obpm.out"; exit 1 }
          & "$env:GITHUB_WORKSPACE\bin\obpm_post.exe" -n 2 fiber.ofd
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke test — BPM propagation map (post output)
        run: |
          Set-Location smoke
          if (-not (Test-Path bpm_ixz.csv)) { Write-Error "bpm_ixz.csv missing"; exit 1 }

      # ONN 光活性化関数 (tpa + powersweep) : activation_curve.csv を生成し、
      # 平面波近似の解析解との一致 (相対 7% 以内) ・単調非増加・飽和を検証する
      - name: Smoke test — ONN activation curve (TPA + powersweep)
        run: |
          New-Item -ItemType Directory -Force smoke-onn | Out-Null
          Copy-Item data/sample/onn_activation.ofd smoke-onn/
          Set-Location smoke-onn
          & "$env:GITHUB_WORKSPACE\bin\obpm.exe" -n 2 onn_activation.ofd
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Path obpm.log -Pattern "normal end" -Quiet)) { Write-Error "no normal end"; exit 1 }
          if (-not (Test-Path activation_curve.csv)) { Write-Error "activation_curve.csv missing"; exit 1 }
          # 定量検証: 平面波近似の解析解 T = 1/(1 + beta*(P_in/A_eff)*L) と比較
          # (3 OS で同一の検証スクリプトを使う。Python 標準ライブラリのみ)
          python "$env:GITHUB_WORKSPACE\tests\check_activation.py" --dir .
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # 解析解との数値一致判定 (Git Bash で Linux/macOS と同一の判定を使う)
      # ONN 活性化曲線は直前のステップで tests/check_activation.py が検証済み。
      # - モード解析: LP01 neff が分散方程式の厳密解 1.447167 と ±5e-4
      # - モード結合率 / テーパ・ツイスト / 対称境界
      - name: Check vs analytic solutions (mode analysis / taper / symmetry)
        shell: bash
        run: |
          mkdir -p smoke-modes && cd smoke-modes
          cp ../data/sample/fiber_modes.ofd .
          ../bin/obpm.exe -n 2 fiber_modes.ofd
          grep -q "normal end" obpm.log
          grep -q "modes : 1 / 3 converged" obpm.log
          awk '/mode 1 : neff/ { err = $NF - 1.447167; if (err < 0) err = -err
               if (err > 5e-4) { print "FAIL: neff " $NF " != 1.447167 (err " err ")"; exit 1 }
               print "mode analysis OK: neff = " $NF; ok = 1 }
               END { if (!ok) { print "FAIL: neff line not found"; exit 1 } }' obpm.log
          # モード結合率 (/trace/overlap) : モード整合励振なので出口でも eta_1 > 0.99
          awk '/overlap eta_1/ { e = $(NF-3) + 0
               if (e < 0.99) { print "FAIL: eta_1 " e " < 0.99 (mode-matched excitation)"; exit 1 }
               print "mode overlap OK: eta_1 = " e; ok = 1 }
               END { if (!ok) { print "FAIL: overlap line not found"; exit 1 } }' obpm.log
          # テーパ/ツイスト (座標変換) : 合計回転角のログと断熱的な電力保存を判定する
          mkdir -p ../smoke-tt && cd ../smoke-tt
          cp ../data/sample/taper_twist.ofd .
          ../bin/obpm.exe -n 2 taper_twist.ofd
          grep -q "normal end" obpm.log
          grep -q "total 90.00 \[deg\]" obpm.log
          awk '/output power/ { p = $(NF-1) + 0
               if (p < 220 || p > 230) { print "FAIL: output power " p " out of [220,230]"; exit 1 }
               print "taper/twist OK: output power = " p; ok = 1 }
               END { if (!ok) { print "FAIL: output power line not found"; exit 1 } }' obpm.log
          # 対称境界 : 半領域計算で出力パワーが全領域の 1/2 になること
          mkdir -p ../smoke-sym && cd ../smoke-sym
          cp ../data/sample/fiber_symmetry.ofd .
          ../bin/obpm.exe -n 2 fiber_symmetry.ofd
          grep -q "normal end" obpm.log
          awk '/output power/ { p = $(NF-1) + 0
               if (p < 155.0 || p > 157.5) { print "FAIL: output power " p " out of range"; exit 1 }
               print "symmetry OK: output power = " p; ok = 1 }
               END { if (!ok) { print "FAIL: output power line not found"; exit 1 } }' obpm.log

      - name: Upload binaries (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: obpm-windows-x64
          path: |
            bin/obpm.exe
            bin/obpm_post.exe

      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path bin/obpm.exe, bin/obpm_post.exe -DestinationPath obpm-windows-x64.zip

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: obpm-windows-x64.zip

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-windows
          path: |
            smoke/*.log
            smoke-onn/*.log
            smoke-rcwa/*.log
          if-no-files-found: ignore

  # CUDA 版のコンパイル・リンク検証 (ランナーに GPU は無いため実行はしない)
  build-cuda:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (incl. CUDA toolkit)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ libhdf5-dev libeigen3-dev nvidia-cuda-toolkit

      - name: Configure (CUDA)
        run: cmake -B build_cuda -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=ON -DWITH_MPI=OFF

      - name: Build obpm_cuda (compile/link only)
        run: cmake --build build_cuda --target obpm_cuda -j"$(nproc)"

  # MPI 版 (obpm_mpi = OpenFDTD 由来の FDTD ソルバー) のビルド検証。
  # mpi/solve.c は並列 HDF5 (H5Pset_fapl_mpio 等) を使うため libhdf5-openmpi-dev が必要。
  build-mpi:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (MPI + parallel HDF5)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ libeigen3-dev \
            libopenmpi-dev openmpi-bin libhdf5-openmpi-dev

      - name: Configure (MPI)
        run: cmake -B build_mpi -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=OFF -DWITH_MPI=ON

      # obpm_mpi だけでなく全ターゲットをビルドする。並列 HDF5 のヘッダは
      # mpi.h を include するため、MPI を使わない obpm / obpm_post 側が
      # 壊れていても --target obpm_mpi では検知できない (実際に起きた)。
      - name: Build all targets (obpm / obpm_post / obpm_mpi)
        run: cmake --build build_mpi -j"$(nproc)"
