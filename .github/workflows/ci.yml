# OpenBPM (処理ロジック) CI — CPU 版ソルバーのビルド + サンプルのスモーク実行。
# CUDA/MPI はランナーに無いため WITH_CUDA=OFF / WITH_MPI=OFF でビルドする。
name: CI

on:
  push:
    branches: [ main, "claude/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # タグ push 時の Release 添付に使用
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc g++ libhdf5-dev libeigen3-dev

      - name: Configure (CPU only)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=OFF -DWITH_MPI=OFF -DWITH_TESTS=ON

      - name: Build obpm / obpm_post
        run: cmake --build build -j"$(nproc)"

      # 解析解と比較する単体テスト (test_wabpm / test_modes / test_allset)
      - name: Unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test — solver (fiber sample)
        run: |
          mkdir -p /tmp/smoke && cp data/sample/fiber.ofd /tmp/smoke/
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 fiber.ofd
          grep -q "normal end" obpm.log
          test -s obpm.out

      - name: Smoke test — post processor
        run: |
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/obpm_post" -n 2 fiber.ofd

      # ONN 光活性化関数 (tpa + powersweep) : activation_curve.csv の単調飽和と
      # 平面波近似の解析解 T = 1/(1 + beta*(P_in/A_eff)*L) との数値一致 (±8%) を判定する
      - name: Smoke test — ONN activation curve (TPA + powersweep)
        run: |
          mkdir -p /tmp/smoke-onn && cp data/sample/onn_activation.ofd /tmp/smoke-onn/
          cd /tmp/smoke-onn
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 onn_activation.ofd
          grep -q "normal end" obpm.log
          test -s activation_curve.csv
          sh "$GITHUB_WORKSPACE/tools/check_activation.sh" activation_curve.csv obpm.log

      # モード解析 (modes = <n> excite) : シングルモードで LP01 のみ導波と判定され、
      # neff が分散方程式の厳密解 1.447167 と一致すること (±5e-4)
      - name: Smoke test — mode analysis (modes keyword)
        run: |
          mkdir -p /tmp/smoke-modes && cp data/sample/fiber_modes.ofd /tmp/smoke-modes/
          cd /tmp/smoke-modes
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 fiber_modes.ofd
          grep -q "normal end" obpm.log
          grep -q "modes : 1 / 3 converged" obpm.log
          awk '/mode 1 : neff/ { err = $NF - 1.447167; if (err < 0) err = -err
               if (err > 5e-4) { print "FAIL: neff " $NF " != 1.447167 (err " err ")"; exit 1 }
               print "mode analysis OK: neff = " $NF; ok = 1 }
               END { if (!ok) { print "FAIL: neff line not found"; exit 1 } }' obpm.log

      # テーパ/ツイスト (座標変換) : 合計回転角のログと断熱的な電力保存を判定する
      # (入射ガウシアン w0=4um の生パワー 226.2 に対し P/P0 = 0.9985)
      - name: Smoke test — taper / twist (coordinate transform)
        run: |
          mkdir -p /tmp/smoke-tt && cp data/sample/taper_twist.ofd /tmp/smoke-tt/
          cd /tmp/smoke-tt
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 taper_twist.ofd
          grep -q "normal end" obpm.log
          grep -q "total 90.00 \[deg\]" obpm.log
          awk '/output power/ { p = $(NF-1) + 0
               if (p < 220 || p > 230) { print "FAIL: output power " p " out of [220,230]"; exit 1 }
               print "taper/twist OK: output power = " p; ok = 1 }
               END { if (!ok) { print "FAIL: output power line not found"; exit 1 } }' obpm.log

      - name: Upload binaries (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: obpm-linux-x64
          path: |
            bin/obpm
            bin/obpm_post

      # タグ (v*) push 時は Release にバイナリを添付する。
      # OpenFDTD-X (GUI) や統合テストはここから取得できる (公開リポジトリ)。
      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar czf obpm-linux-x64.tar.gz -C bin obpm obpm_post

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: obpm-linux-x64.tar.gz

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            /tmp/smoke/*.log
            /tmp/smoke-onn/*.log
          if-no-files-found: ignore

  # macOS (Apple Silicon)。AppleClang は OpenMP を同梱しないため、
  # Homebrew の libomp を明示指定して find_package(OpenMP) を通す。
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write   # タグ push 時の Release 添付に使用
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install libomp hdf5 eigen

      - name: Configure (CPU only)
        run: |
          OMP="$(brew --prefix libomp)"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=OFF -DWITH_MPI=OFF -DWITH_TESTS=ON \
            -DOpenMP_C_FLAGS="-Xclang -fopenmp -I${OMP}/include" \
            -DOpenMP_C_LIB_NAMES=omp \
            -DOpenMP_CXX_FLAGS="-Xclang -fopenmp -I${OMP}/include" \
            -DOpenMP_CXX_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="${OMP}/lib/libomp.dylib"

      - name: Build obpm / obpm_post
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      # 解析解と比較する単体テスト (test_wabpm / test_modes / test_allset)
      - name: Unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test — solver (fiber sample)
        run: |
          mkdir -p /tmp/smoke && cp data/sample/fiber.ofd /tmp/smoke/
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 fiber.ofd
          grep -q "normal end" obpm.log
          test -s obpm.out

      - name: Smoke test — post processor
        run: |
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/obpm_post" -n 2 fiber.ofd

      # ONN 光活性化関数 (tpa + powersweep) : activation_curve.csv の単調飽和と
      # 平面波近似の解析解 T = 1/(1 + beta*(P_in/A_eff)*L) との数値一致 (±8%) を判定する
      - name: Smoke test — ONN activation curve (TPA + powersweep)
        run: |
          mkdir -p /tmp/smoke-onn && cp data/sample/onn_activation.ofd /tmp/smoke-onn/
          cd /tmp/smoke-onn
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 onn_activation.ofd
          grep -q "normal end" obpm.log
          test -s activation_curve.csv
          sh "$GITHUB_WORKSPACE/tools/check_activation.sh" activation_curve.csv obpm.log

      # モード解析 (modes = <n> excite) : シングルモードで LP01 のみ導波と判定され、
      # neff が分散方程式の厳密解 1.447167 と一致すること (±5e-4)
      - name: Smoke test — mode analysis (modes keyword)
        run: |
          mkdir -p /tmp/smoke-modes && cp data/sample/fiber_modes.ofd /tmp/smoke-modes/
          cd /tmp/smoke-modes
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 fiber_modes.ofd
          grep -q "normal end" obpm.log
          grep -q "modes : 1 / 3 converged" obpm.log
          awk '/mode 1 : neff/ { err = $NF - 1.447167; if (err < 0) err = -err
               if (err > 5e-4) { print "FAIL: neff " $NF " != 1.447167 (err " err ")"; exit 1 }
               print "mode analysis OK: neff = " $NF; ok = 1 }
               END { if (!ok) { print "FAIL: neff line not found"; exit 1 } }' obpm.log

      # テーパ/ツイスト (座標変換) : 合計回転角のログと断熱的な電力保存を判定する
      # (入射ガウシアン w0=4um の生パワー 226.2 に対し P/P0 = 0.9985)
      - name: Smoke test — taper / twist (coordinate transform)
        run: |
          mkdir -p /tmp/smoke-tt && cp data/sample/taper_twist.ofd /tmp/smoke-tt/
          cd /tmp/smoke-tt
          "$GITHUB_WORKSPACE/bin/obpm" -n 2 taper_twist.ofd
          grep -q "normal end" obpm.log
          grep -q "total 90.00 \[deg\]" obpm.log
          awk '/output power/ { p = $(NF-1) + 0
               if (p < 220 || p > 230) { print "FAIL: output power " p " out of [220,230]"; exit 1 }
               print "taper/twist OK: output power = " p; ok = 1 }
               END { if (!ok) { print "FAIL: output power line not found"; exit 1 } }' obpm.log

      - name: Upload binaries (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: obpm-macos-arm64
          path: |
            bin/obpm
            bin/obpm_post

      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar czf obpm-macos-arm64.tar.gz -C bin obpm obpm_post

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: obpm-macos-arm64.tar.gz

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-macos
          path: |
            /tmp/smoke/*.log
            /tmp/smoke-onn/*.log
          if-no-files-found: ignore

  # Windows (MSVC)。依存は vcpkg (x64-windows-static-md 静的リンク) で導入し、
  # DLL 同梱不要の自己完結 exe を生成する。ビルドは MSVC 環境 + Ninja。
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write   # タグ push 時の Release 添付に使用
    steps:
      - uses: actions/checkout@v4

      # hdf5 の既定機能 szip は libaec を gitlab.dkrz.de から取得するが
      # 429 で落ちることがあるため、必要な core+zlib のみに絞る
      - name: Install dependencies (vcpkg)
        run: vcpkg install "hdf5[core,zlib]:x64-windows-static-md" eigen3:x64-windows-static-md --recurse

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (CPU only)
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DWITH_CUDA=OFF -DWITH_MPI=OFF -DWITH_TESTS=ON
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build obpm / obpm_post
        run: cmake --build build

      # 解析解と比較する単体テスト (Linux/macOS と同一の 3 スイート)
      - name: Unit tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test — solver (fiber sample)
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          Copy-Item data/sample/fiber.ofd smoke/
          Set-Location smoke
          & "$env:GITHUB_WORKSPACE\bin\obpm.exe" -n 2 fiber.ofd
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Path obpm.log -Pattern "normal end" -Quiet)) { Write-Error "no normal end"; exit 1 }
          if ((Get-Item obpm.out).Length -eq 0) { Write-Error "empty obpm.out"; exit 1 }
          & "$env:GITHUB_WORKSPACE\bin\obpm_post.exe" -n 2 fiber.ofd
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke test — BPM propagation map (post output)
        run: |
          Set-Location smoke
          if (-not (Test-Path bpm_ixz.csv)) { Write-Error "bpm_ixz.csv missing"; exit 1 }

      # ONN 光活性化関数 (tpa + powersweep) : activation_curve.csv の生成と
      # 単調飽和 (T が P_in について単調非増加、初点 T > 終点 T*1.5) を判定する
      - name: Smoke test — ONN activation curve (TPA + powersweep)
        run: |
          New-Item -ItemType Directory -Force smoke-onn | Out-Null
          Copy-Item data/sample/onn_activation.ofd smoke-onn/
          Set-Location smoke-onn
          & "$env:GITHUB_WORKSPACE\bin\obpm.exe" -n 2 onn_activation.ofd
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Path obpm.log -Pattern "normal end" -Quiet)) { Write-Error "no normal end"; exit 1 }
          if (-not (Test-Path activation_curve.csv)) { Write-Error "activation_curve.csv missing"; exit 1 }
          $t = Import-Csv activation_curve.csv | ForEach-Object { [double]$_.transmission }
          if ($t.Count -lt 8) { Write-Error "too few sweep points: $($t.Count)"; exit 1 }
          for ($i = 1; $i -lt $t.Count; $i++) {
            if ($t[$i] -gt $t[$i-1] * 1.000001) { Write-Error "not monotone at point $i"; exit 1 }
          }
          if (-not ($t[0] -gt $t[-1] * 1.5)) { Write-Error "no saturation: first=$($t[0]), last=$($t[-1])"; exit 1 }
          Write-Output "activation curve OK: T $($t[0]) -> $($t[-1])"

      # 解析解との数値一致判定 (Git Bash で Linux/macOS と同一のスクリプト・判定を使う)
      # - ONN 活性化曲線: T = 1/(1 + beta*(P_in/A_eff)*L) と ±8%
      # - モード解析: LP01 neff が分散方程式の厳密解 1.447167 と ±5e-4
      - name: Check vs analytic solutions (ONN curve + mode analysis)
        shell: bash
        run: |
          cd smoke-onn
          sh ../tools/check_activation.sh activation_curve.csv obpm.log
          mkdir -p ../smoke-modes && cd ../smoke-modes
          cp ../data/sample/fiber_modes.ofd .
          ../bin/obpm.exe -n 2 fiber_modes.ofd
          grep -q "normal end" obpm.log
          grep -q "modes : 1 / 3 converged" obpm.log
          awk '/mode 1 : neff/ { err = $NF - 1.447167; if (err < 0) err = -err
               if (err > 5e-4) { print "FAIL: neff " $NF " != 1.447167 (err " err ")"; exit 1 }
               print "mode analysis OK: neff = " $NF; ok = 1 }
               END { if (!ok) { print "FAIL: neff line not found"; exit 1 } }' obpm.log
          # テーパ/ツイスト (座標変換) : 合計回転角のログと断熱的な電力保存を判定する
          mkdir -p ../smoke-tt && cd ../smoke-tt
          cp ../data/sample/taper_twist.ofd .
          ../bin/obpm.exe -n 2 taper_twist.ofd
          grep -q "normal end" obpm.log
          grep -q "total 90.00 \[deg\]" obpm.log
          awk '/output power/ { p = $(NF-1) + 0
               if (p < 220 || p > 230) { print "FAIL: output power " p " out of [220,230]"; exit 1 }
               print "taper/twist OK: output power = " p; ok = 1 }
               END { if (!ok) { print "FAIL: output power line not found"; exit 1 } }' obpm.log

      - name: Upload binaries (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: obpm-windows-x64
          path: |
            bin/obpm.exe
            bin/obpm_post.exe

      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path bin/obpm.exe, bin/obpm_post.exe -DestinationPath obpm-windows-x64.zip

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: obpm-windows-x64.zip

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-windows
          path: |
            smoke/*.log
            smoke-onn/*.log
            smoke-rcwa/*.log
          if-no-files-found: ignore
